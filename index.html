        const color = spec.key === "pnl" && vals[vals.length - 1] < 0 ? "#fb7185" : spec.color;
        const y = spec.side === "R" ? yR : yL;
        const pts = vals.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
        marks += `<polyline fill="none" stroke="${color}" stroke-width="2" points="${pts}" />`;
        vals.forEach((v, i) => {
          marks += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6" fill="${color}" />`;
        });
      });
      const zero = (loR < 0 && hiR > 0) ? `<line x1="${left}" y1="${yR(0).toFixed(1)}" x2="${w - right}" y2="${yR(0).toFixed(1)}" stroke="#334155" />` : "";
      const legend = series.map((spec, i) => {
        const lx = 168 + i * 160;
        return `<circle cx="${lx}" cy="14" r="4" fill="${spec.color}" /><text x="${lx + 10}" y="18" fill="#cbd5e1" font-size="12">${spec.name}</text>`;
      }).join("");
      const t0 = String(list[0].at).slice(5, 16);
      const t1 = String(list[list.length - 1].at).slice(5, 16);
      svg.innerHTML = `${legend}${zero}${marks}<text x="6" y="${top + 10}" fill="#94a3b8" font-size="11">${yenText(Math.max.apply(null, equity.concat(cash)), false)}</text><text x="6" y="${h - bottom}" fill="#94a3b8" font-size="11">${yenText(Math.min.apply(null, cash.concat(equity)), false)}</text><text x="${w - 6}" y="${top + 10}" fill="#34d399" font-size="11" text-anchor="end">${yenText(Math.max.apply(null, pnl), true)}</text><text x="${w - 6}" y="${h - bottom}" fill="#34d399" font-size="11" text-anchor="end">${yenText(Math.min(0, Math.min.apply(null, pnl)), true)}</text><text x="${left}" y="${h - 4}" fill="#94a3b8" font-size="11">${t0}</text><text x="${w - right}" y="${h - 4}" fill="#94a3b8" font-size="11" text-anchor="end">${t1}</text><g id="hoverTip" visibility="hidden" pointer-events="none"><line id="hoverLine" stroke="#64748b" stroke-dasharray="3 3" /><rect id="hoverBox" rx="6" fill="#020617" stroke="#334155" /><text id="hoverWhen" fill="#94a3b8" font-size="11"></text><text id="hoverEq" fill="#e2e8f0" font-size="12"></text><text id="hoverCash" fill="#fbbf24" font-size="12"></text><text id="hoverPnl" fill="#34d399" font-size="12"></text></g>`;
      const tip = document.getElementById("hoverTip");
      const hoverLine = document.getElementById("hoverLine");
      const hoverBox = document.getElementById("hoverBox");
      const hoverWhen = document.getElementById("hoverWhen");
      const hoverEq = document.getElementById("hoverEq");
      const hoverCash = document.getElementById("hoverCash");
      const hoverPnl = document.getElementById("hoverPnl");
      const boxW = 168, boxH = 74;
      const place = (index, px, py) => {
        const row = list[index];
        hoverLine.setAttribute("x1", x(index));
        hoverLine.setAttribute("x2", x(index));
        hoverLine.setAttribute("y1", top);
        hoverLine.setAttribute("y2", h - bottom);
        hoverWhen.textContent = String(row.at).slice(5, 16);
        hoverEq.textContent = "時価総額 " + yenText(row.equity, false);
        hoverCash.textContent = "現金 " + yenText(row.cash, false);
        hoverPnl.textContent = "開始来収支 " + yenText(row.pnl, true);
        hoverPnl.setAttribute("fill", Number(row.pnl) < 0 ? "#fb7185" : "#34d399");
        let bx = px + 14;
        let by = py - 16;
        if (bx + boxW > w - 4) bx = px - boxW - 14;
        if (bx < 4) bx = 4;
        if (by < 4) by = 4;
        if (by + boxH > h - 4) by = h - boxH - 4;
        hoverBox.setAttribute("x", bx);
        hoverBox.setAttribute("y", by);
        hoverBox.setAttribute("width", boxW);
        hoverBox.setAttribute("height", boxH);
        [hoverWhen, hoverEq, hoverCash, hoverPnl].forEach((node, i) => {
          node.setAttribute("x", bx + 10);
          node.setAttribute("y", by + 16 + i * 16);
        });
        tip.setAttribute("visibility", "visible");
      };
      const nearest = (clientX, clientY) => {
        const pt = svg.createSVGPoint();
        pt.x = clientX;
        pt.y = clientY;
        const ctm = svg.getScreenCTM();
        if (!ctm) return;
        const loc = pt.matrixTransform(ctm.inverse());
        let best = 0;
        let bestDist = Infinity;
        for (let i = 0; i < list.length; i++) {
          const dist = Math.abs(x(i) - loc.x);
          if (dist < bestDist) { best = i; bestDist = dist; }
        }
        place(best, loc.x, loc.y);
      };
      svg.onmousemove = (ev) => nearest(ev.clientX, ev.clientY);
      svg.onmouseleave = () => tip.setAttribute("visibility", "hidden");
    }
    const yen = (n) => (n == null || n === "") ? "-" : Math.floor(Number(n)).toLocaleString("ja-JP") + "円";
    const ylink = (code, name, url) => {
      const href = url || ("https://finance.yahoo.co.jp/quote/" + code);
      return `<a href="${href}" target="_blank" rel="noopener">${name || code}</a>`;
    };
    const META = [
      { id: "macro", name: "マクロアナリスト", color: "#38bdf8" },
      { id: "technical", name: "テクニカルアナリスト", color: "#a78bfa" },
      { id: "bull", name: "強気派", color: "#f59e0b" },
      { id: "risk", name: "リスクマネージャー", color: "#f43f5e" },
      { id: "executor", name: "執行エージェント", color: "#34d399" }
    ];
    const last = window.STATE.last_run || {};
    const p = window.STATE.portfolio || {};
    document.getElementById("equity").textContent = yen(window.STATE.equity);
    document.getElementById("cash").textContent = yen(p.cash_balance);
    document.getElementById("posCount").textContent = ((p.positions || []).length) + "件";
    const pnl = last.pnl || {};
    const total = pnl.total;
    const pnlEl = document.getElementById("pnlTotal");
    pnlEl.textContent = (total == null) ? "-" : ((total >= 0 ? "+" : "") + yen(total));
    pnlEl.style.color = (total == null || total >= 0) ? "#34d399" : "#fb7185";
    document.getElementById("pnlDetail").textContent = last.session
      ? ("次約定 " + last.session.fill_at + " " + last.session.label)
      : "";
    drawBalanceCharts(window.STATE.balance || []);
    const sm = last.screen_meta || {};
    if (sm.universe) {
      document.getElementById("sub").textContent =
        `東証内国株式 ${sm.universe}銘柄 → 単元適格 ${sm.s_share_eligible || "-"} · 元手100,000万円 · スナップショット`;
    }
    const summaries = {};
    (last.agents || []).forEach(a => summaries[a.id] = a.summary);
    document.getElementById("agents").innerHTML = META.map(a =>
      `<div class="card"><div class="dot" style="background:${a.color}"></div><div style="font-weight:600;font-size:13px">${a.name}</div><div class="muted" style="margin:8px 0 0;line-height:1.5">${summaries[a.id] || "未実行"}</div></div>`
    ).join("");
    const positions = p.positions || [];
    const priceAt = document.getElementById("priceAt");
    const stamped = p.price_updated_at || last.price_updated_at || "";
    if (priceAt) priceAt.textContent = stamped ? stamped.slice(5, 16) : "";
    document.getElementById("posBody").innerHTML = positions.length ? positions.map(pos => {
      const pnl = (pos.current_price - pos.buy_price) * pos.shares;
      const pct = pos.buy_price ? ((pos.current_price - pos.buy_price) / pos.buy_price * 100) : 0;
      const pctText = (pct > 0 ? "+" : "") + pct.toFixed(1) + "%";
      const cls = pnl >= 0 ? "pos" : "neg";
      return `<tr><td>${ylink(pos.code, pos.name, pos.yahoo_url)}<div class="muted">${pos.code}</div></td><td>${pos.shares}</td><td>${yen(pos.buy_price)}</td><td>${yen(pos.current_price)}</td><td class="${cls}">${yen(pnl)}<div style="font-size:11px">${pctText}</div></td></tr>`;
    }).join("") : `<tr><td colspan="5" class="muted">保有なし</td></tr>`;
    const purchaseRows = [];
    const seenPurchase = new Set();
    const slotText = (at, label) => [at, label].filter(Boolean).join(" ");
    const rememberPurchase = (row) => {
      const key = [row.side, row.code, row.at].join("|");
      if (seenPurchase.has(key)) return;
      seenPurchase.add(key);
      purchaseRows.push(row);
    };
    (p.fill_history || []).forEach(f => {
      const sell = f.side === "SELL";
      rememberPurchase({ at: slotText(f.fill_at, f.label), side: sell ? "売" : "買", code: f.code, name: f.name, yahoo_url: f.yahoo_url, shares: f.shares, price: f.price, state: sell ? "売却済み" : "約定済み" });
    });
    (p.positions || []).forEach(pos => {
      rememberPurchase({ at: slotText(pos.fill_at || pos.buy_date, pos.label), side: "買", code: pos.code, name: pos.name, yahoo_url: pos.yahoo_url, shares: pos.shares, price: pos.buy_price, state: "保有中" });
    });
    (p.trade_history || []).forEach(t => {
      rememberPurchase({ at: slotText(t.buy_fill_at || t.buy_date, t.buy_label), side: "買", code: t.code, name: t.name, yahoo_url: t.yahoo_url, shares: t.shares, price: t.buy_price, state: "売却済み" });
      rememberPurchase({ at: slotText(t.fill_at || t.sell_date, t.label), side: "売", code: t.code, name: t.name, yahoo_url: t.yahoo_url, shares: t.shares, price: t.sell_price, state: "売却済み" + (t.profit == null ? "" : (" " + yen(t.profit))) });
    });
    (p.pending_orders || []).forEach(o => {
      const buy = o.side === "BUY";
      rememberPurchase({ at: slotText(o.fill_at, o.label), side: buy ? "買" : "売", code: o.code, name: o.name, yahoo_url: o.yahoo_url, shares: o.shares, price: o.price, state: "予約" });
    });
    purchaseRows.sort((a, b) => String(b.at).localeCompare(String(a.at)));
    document.getElementById("buyCount").textContent = "全" + purchaseRows.length + "件";
    document.getElementById("buyBody").innerHTML = purchaseRows.length ? purchaseRows.map(r =>
      `<tr><td>${r.at || "-"}</td><td>${r.side}</td><td>${ylink(r.code, r.name, r.yahoo_url)}<div class="muted">${r.code || ""}</div></td><td>${r.shares ?? "-"}</td><td>${yen(r.price)}</td><td class="muted">${r.state}</td></tr>`
    ).join("") : `<tr><td colspan="6" class="muted">売買履歴なし</td></tr>`;
    const votes = (last.bull && last.bull.votes) || {};
    const cands = (last.technical && last.technical.candidates) || [];
    const voteRank = { high: 3, medium: 2, low: 1 };
    let sortKey = "score";
    let sortDir = -1;
    const secSel = document.getElementById("sectorFilter");
    const sectors = [...new Set(cands.map(c => c.sector).filter(Boolean))].sort();
    secSel.innerHTML = '<option value="">すべて</option>' + sectors.map(s => `<option value="${s}">${s}</option>`).join("");
    const paintCands = () => {
      const sector = secSel.value;
      let rows = cands.filter(c => !sector || c.sector === sector);
      rows = rows.slice().sort((a, b) => {
        const pick = (c) => sortKey === "name" ? (c.name || "") :
          sortKey === "price" ? (c.current_price || 0) :
          sortKey === "change" ? (c.change_pct || 0) :
          sortKey === "vote" ? (voteRank[votes[c.code]] || 0) :
          sortKey === "x" ? (c.x_bonus || 0) : (c.score || 0);
        const av = pick(a), bv = pick(b);
        if (av < bv) return -1 * sortDir;
        if (av > bv) return 1 * sortDir;
        return 0;
      });
      document.getElementById("candCount").textContent = rows.length + "件";
      document.getElementById("candBody").innerHTML = rows.length ? rows.map(c => {
        const sign = c.change_pct >= 0 ? "+" : "";
        return `<tr><td>${ylink(c.code, c.name, c.yahoo_url)}<div class="muted">${c.code}</div></td><td class="muted">${c.sector || "-"}</td><td>${yen(c.current_price)}</td><td>${sign}${c.change_pct}%</td><td>${c.score}</td><td>${votes[c.code] || "-"}</td><td>${c.x_bonus ? (c.x_bonus + "pt") : "-"}</td><td class="muted">${(c.reasons || []).join(" / ")}</td></tr>`;
      }).join("") : `<tr><td colspan="8" class="muted">該当なし</td></tr>`;
    };
    secSel.onchange = paintCands;
    document.querySelectorAll("th[data-sort]").forEach(th => {
      th.onclick = () => {
        const k = th.getAttribute("data-sort");
        if (sortKey === k) sortDir *= -1;
        else { sortKey = k; sortDir = k === "name" ? 1 : -1; }
        paintCands();
      };
    });
    paintCands();
    const days = window.STATE.intel_history || [];
    document.getElementById("reviewCount").textContent = "全" + days.length + "件";
    const reviewBody = document.getElementById("reviewBody");
    let sel = days.length ? (days[0].updated_at || days[0].date) : "";
    const paint = () => {
      if (!days.length) {
        reviewBody.innerHTML = `<tr><td colspan="4" class="muted">検討履歴なし</td></tr>`;
        document.getElementById("intelSummary").textContent = "履歴なし";
        document.getElementById("intelTop").innerHTML = "";
        document.getElementById("intelXItems").innerHTML = "";
        return;
      }
      reviewBody.innerHTML = days.map(d => {
        const id = d.updated_at || d.date;
        const session = d.session || {};
        const analysis = d.analysis || {};
        const reviewed = (d.review && d.review.length) || (d.market && d.market.reviewed) || ((d.market || {}).top_candidates || []).length;
        const bg = id === sel ? "#1e293b" : "transparent";
        return `<tr data-day="${id}" style="background:${bg};cursor:pointer"><td>${id}</td><td>${session.label || "-"} ${session.fill_at || ""}</td><td>${analysis.technical || (d.market || {}).summary || "-"}</td><td class="muted">${analysis.risk || ""} ${analysis.executor || ""} / 候補${reviewed}件</td></tr>`;
      }).join("");
      const day = days.find(d => (d.updated_at || d.date) === sel) || days[0];
      const m = day.market || {};
      const x = day.x || {};
      const analysis = day.analysis || {};
      document.getElementById("intelSummary").textContent = ((day.updated_at || day.date) + " " + [analysis.macro, analysis.bull, analysis.risk, analysis.executor, x.summary].filter(Boolean).join(" "));
      document.getElementById("intelMarket").textContent = `地合い ${m.regime || "-"} · 走査 ${m.universe || "-"}銘柄 · 候補 ${((day.review && day.review.length) || (m.top_candidates || []).length)}件`;
      const names = (day.review && day.review.length) ? day.review : (m.top_candidates || []);
      document.getElementById("intelTop").innerHTML = names.map(c =>
        `<li><span>${ylink(c.code, c.name, c.yahoo_url)}</span><span class="muted">${c.score}点 ${c.outcome || ""}</span></li>`
      ).join("") || "<li class='muted'>なし</li>";
      document.getElementById("intelX").textContent = x.summary || "";
      const themeSel = document.getElementById("xThemeFilter");
      const keep = themeSel.value;
      const themes = (x.themes || []).map(t => t.theme);
      themeSel.innerHTML = '<option value="">テーマすべて</option>' + themes.map(t => `<option value="${t}">${t}</option>`).join("");
      if ([...themeSel.options].some(o => o.value === keep)) themeSel.value = keep;
      const theme = themeSel.value;
      const xitems = (x.items || []).filter(it => !theme || it.theme === theme);
      document.getElementById("intelXItems").innerHTML = xitems.length ? xitems.map(it =>
        `<li><span>${ylink(it.code, it.name, it.yahoo_url)}</span><span class="muted">${it.theme} · ${it.count}件</span></li>`
      ).join("") : "<li class='muted'>なし</li>";
    };
    reviewBody.onclick = (e) => {
      const b = e.target.closest("tr[data-day]");
      if (!b) return;
      sel = b.getAttribute("data-day");
      paint();
    };
    paint();
    document.getElementById("xThemeFilter").onchange = paint;
    const idx = window.STATE.search_index || [];
    const box = document.getElementById("searchResults");
    const searchInput = document.getElementById("stockSearch");
    const runLocalSearch = (q) => {
      const n = (q || "").trim().toLowerCase().replace(".t", "");
      if (!n) { box.style.display = "none"; return; }
      const hits = [];
      for (const row of idx) {
        const hay = (row[0] + " " + row[1] + " " + (row[2] || "")).toLowerCase();
        if (hay.includes(n)) hits.push(row);
        if (hits.length >= 20) break;
      }
      box.style.display = "block";
      box.innerHTML = hits.length ? hits.map(r =>
        `<a style="display:block;padding:8px 10px;border-bottom:1px solid #1e293b;color:#e2e8f0;text-decoration:none" href="https://finance.yahoo.co.jp/quote/${r[0]}" target="_blank" rel="noopener"><b>${r[1]}</b> <span class="muted">${r[0]} ${r[2] || ""}</span></a>`
      ).join("") : `<p class="muted" style="padding:10px">該当なし</p>`;
    };
    let st = null;
    searchInput.addEventListener("input", (e) => {
      clearTimeout(st);
      st = setTimeout(() => runLocalSearch(e.target.value), 160);
    });
  </script>
</body>
</html>
